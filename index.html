<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self'"><title>Gurke Client</title><link rel="stylesheet" href="styles.css"></head>
<body>
<nav class="rail"><div class="brand">🥒</div><button class="nav active" data-view="home">🏠</button><button class="nav" data-view="settings">⚙️</button><button class="nav" data-view="console">🖥️</button><div class="spacer"></div><button class="nav" id="folderBtn">📂</button></nav>
<section class="stage"><div class="bg"><i class="orb o1"></i><i class="orb o2"></i><div class="grid"></div></div>
<div class="view" id="view-home"><div class="hero"><div class="kicker">MINECRAFT LAUNCHER • WINDOWS + STEAMOS</div><h1>GURKE<span>CLIENT</span></h1><p>Frisch. Grün. Knackig.</p></div></div>
<div class="view hidden" id="view-settings"><div class="panel"><h2>Einstellungen</h2><div class="settings-grid">
<section class="setting"><h3>🎮 Minecraft</h3><label>Arbeitsspeicher <b id="ramVal">4096</b> MB</label><input type="range" id="ram" min="1024" max="16384" step="512" value="4096"><label>Spielordner</label><input id="gameDir" type="text" placeholder="Standard"><label>Auflösung</label><div style="display:flex;gap:8px"><input id="width" type="number" min="640"><input id="height" type="number" min="480"></div><label class="switch"><input id="fullscreen" type="checkbox"> Vollbild</label></section>
<section class="setting"><h3>☕ Java</h3><label>Java-Modus</label><select id="javaMode"><option value="auto">Automatisch erkennen</option><option value="custom">Eigener Java-Pfad</option></select><label>Java-Pfad</label><input id="javaPath" type="text" placeholder="z.B. /usr/lib/jvm/.../bin/java"><div class="actions"><button class="pill" id="detectJava">Java erkennen</button></div><div class="hint" id="javaResult">Noch nicht geprüft.</div></section>
<section class="setting"><h3>⚙️ JVM</h3><label>JVM-Argumente</label><textarea id="jvmArgs" placeholder="-XX:+UseG1GC"></textarea><label>Zusätzliche Minecraft-Argumente</label><textarea id="gameArgs" placeholder="Optional"></textarea></section>
<section class="setting"><h3>🖥️ Launcher</h3><label class="switch"><input id="closeOnStart" type="checkbox"> Launcher beim Spielstart verstecken</label><label class="switch"><input id="showConsole" type="checkbox"> Konsole anzeigen</label><label class="switch"><input id="animations" type="checkbox"> Animationen</label><div class="actions"><button class="pill ghost" id="reset">Einstellungen zurücksetzen</button></div></section>
</div></div></div>
<div class="console hidden" id="view-console"><pre id="log"></pre></div>
<footer class="bar"><div class="account"><div id="avatar">?</div><div class="meta"><div id="accName">Nicht angemeldet</div><div class="small" id="accSub">Microsoft-Konto nötig</div></div><button id="loginBtn" class="pill">Anmelden</button><button id="logoutBtn" class="pill ghost hidden">Abmelden</button></div>
<div class="mid"><div class="status" id="status">Bereit.</div><div class="progress"><div id="bar"></div></div></div>
<div class="picker" id="picker"><button class="pick-btn" id="pickBtn"><span class="pk-label">VERSION</span><span class="pk-value" id="pickValue">Lade …</span><span class="chev">▲</span></button><div class="pop"><input id="search" placeholder="Version suchen …"><div class="tabs"><button class="tab active" data-tab="release">Releases</button><button class="tab" data-tab="snapshot">Snapshots</button></div><div class="list" id="list"></div></div></div>
<button id="playBtn" class="play"><span>SPIELEN</span><small id="playSub">Version wählen</small></button></footer></section><script src="renderer.js"></script></body></html>
