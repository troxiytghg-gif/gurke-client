name: Build Gurke Client

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build AppImage
        run: npm run build:steamdeck -- --publish=never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Gurke-Client-SteamOS
          path: dist/*.AppImage
